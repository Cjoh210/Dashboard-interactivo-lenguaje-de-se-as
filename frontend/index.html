<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Traducción Lengua de Señas</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 80%;
            max-width: 1200px;
        }

        /* Estilos para los paneles */
        .panel {
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .video-panel {
            backdrop-filter: blur(15px);
        }
        video {
            width: 100%;
            max-width: 600px;
        }

        .chart-panel {
            backdrop-filter: blur(15px);
        }
        canvas {
            width: 100%;
            max-width: 600px;
        }

        .webcam-panel {
            backdrop-filter: blur(15px);
        }
        video.webcam-video {
            width: 100%;
            max_width: 600px;
        }

        .scatter-panel {
            backdrop-filter: blur(15px);
        }

        /* Estilos para los controles */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        button {
            padding: 8px 16px;
            background-color: #38bdf8;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        /* Estilos para el gráfico de líneas */
        .line-chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>

<div class="grid-container">
    <!-- Panel superior izquierdo: Reproductor de video -->
    <div class="video-panel panel">
        <video id="reference-video" controls autoplay loop>
            <source src="/videos/referencia.mp4" type="video/mp4">
            Tu navegador no soporta el elemento <code>video</code>.
        </video>
    </div>

    <!-- Panel superior derecho: Gráfico de líneas -->
    <div class="chart-panel panel">
        <div class="line-chart-container">
            <canvas id="line-chart"></canvas>
        </div>
    </div>

    <!-- Panel inferior izquierdo: Cámara en vivo (placeholder) -->
    <div class="webcam-panel panel controls">
        <video id="webcam-video" class="webcam-video"></video>
        <button onclick="startCamera()">Iniciar cámara</button>
    </div>

    <!-- Panel inferior derecho: Gráfico de dispersión -->
    <div class="scatter-panel panel">
        <canvas id="scatter-chart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="red-line-plugin.js"></script>
<script src="load-reference-landmarks.js"></script>
<script>
    // Variables para almacenar los datos del gráfico
    let lineChartData = [];
    let scatterUserData = [];
    let scatterReferenceData = [];

    const socket = new WebSocket('ws://localhost:8000/ws');

    // Conectar al servidor WebSocket
    socket.onopen = () => {
        console.log('Conexión establecida con el servidor');
    };

    // Manejar mensajes del servidor
    socket.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            updateCharts(data);
        } catch (error) {
            console.error('Error al解析消息:', error);
        }
    };

    // Manejar errores
    socket.onerror = (error) => {
        console.error('Error WebSocket:', error);
    };

    // Manejar cierre de conexión
    socket.onclose = () => {
        console.log('Conexión cerrada con el servidor');
    };

    // Configuración inicial de los gráficos
    const ctxLine = document.getElementById('line-chart').getContext('2d');

    const lineChart = new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Trayectoria X e Y (landmark 8)',
                data: lineChartData,
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Tiempo (segundos)'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Posición'
                    }
                }
            },
            plugins: {
                redLinePlugin: {}
            }
        }
    });

    const ctxScatter = document.getElementById('scatter-chart').getContext('2d');

    const scatterChart = new Chart(ctxScatter, {
        type: 'scatter',
        data: {
            labels: [],
            datasets: [{
                label: 'Landmarks del usuario en tiempo real (púrpura)',
                data: scatterUserData,
                backgroundColor: 'rgba(148, 0, 211, 0.2)',
                borderColor: 'purple',
                borderWidth: 1
            }, {
                label: 'Landmarks de referencia (verde)',
                data: scatterReferenceData,
                backgroundColor: 'rgba(0, 255, 0, 0.2)',
                borderColor: 'green',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                x: {
                    min: 0,
                    max: 1,
                    title: {
                        display: true,
                        text: 'Coordenada X'
                    }
                },
                y: {
                    min: 0,
                    max: 1,
                    title: {
                        display: true,
                        text: 'Coordenada Y (inversa)'
                    },
                    reverse: true
                }
            }
        }
    });

    // Función para actualizar los gráficos
    function updateCharts(data) {
        const timestamp = performance.now() / 1000;
        if (!lineChart.data.labels.includes(timestamp)) {
            lineChartData.push({ x: timestamp, y: data.fingertip.x });
            scatterUserData.push({ x: data.fingertip.x, y: 1 - data.fingertip.y });
            scatterChart.update();
        }
    }

    // Función para iniciar la cámara
    async function startCamera() {
        try {
            const constraints = { video: true };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const webcamVideo = document.getElementById('webcam-video');
            webcamVideo.srcObject = stream;

            setInterval(async () => {
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const context = canvas.getContext('2d');
                context.drawImage(webcamVideo, 0, 0);

                await socket.send(canvas.toDataURL('image/png'));
            }, 100);
        } catch (error) {
            console.error("Error al iniciar la cámara:", error);
        }
    }

    if ("webkitMediaStream" in window) {
        navigator.getUserMedia = function(constraints, successCallback, errorCallback) {
            return navigator.mediaDevices.getUserMedia({
                audio: constraints.audio,
                video: constraints.video
            }).then(stream => {
                successCallback(new MediaStreamTrack(stream.getVideoTracks()));
            }, errorCallback);
        };
    }

    // Manejar el evento timeupdate del video de referencia
    const referenceVideo = document.getElementById('reference-video');
    referenceVideo.addEventListener('timeupdate', () => {
        if (referenceLandmarks.length > 0) {
            const currentTime = referenceVideo.currentTime;
            const currentFrame = Math.floor(currentTime * referenceVideo.playbackRate);
            if (currentFrame < referenceLandmarks.length) {
                scatterReferenceData = referenceLandmarks[currentFrame].map(landmark => ({
                    x: landmark.x,
                    y: 1 - landmark.y
                }));
                scatterChart.update();
            }
        } else {
            scatterReferenceData = [];
            scatterChart.update();
        }
    });

    // Ocultar el dataset de referencia cuando el video no esté en reproducción
    referenceVideo.addEventListener('pause', () => {
        scatterReferenceData = [];
        scatterChart.update();
    });
</script>

</body>
</html>
