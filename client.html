<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hand Landmarks — Test Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 16px; }
    h1 { font-size: 1.4rem; }
    #status { padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; background: #333; }
    #status.connected { background: #1a6b3a; }
    #status.error { background: #7a1a1a; }
    .row { display: flex; gap: 16px; align-items: flex-start; }
    canvas { border-radius: 8px; background: #222; }
    #info { background: #1e1e1e; padding: 16px; border-radius: 8px; min-width: 220px; font-size: 0.82rem; line-height: 1.8; }
    button { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    #btnConnect { background: #2563eb; color: #fff; }
    #btnConnect.stop { background: #dc2626; }
    label { font-size: 0.82rem; color: #aaa; }
    input[type=text] { background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; width: 220px; }
  </style>
</head>
<body>
  <h1>🖐 Hand Landmarks — Test Client</h1>

  <div style="display:flex;gap:12px;align-items:center;">
    <label>WS URL:
      <input type="text" id="wsUrl" value="ws://localhost:8000/ws" />
    </label>
    <button id="btnConnect">Conectar</button>
    <span id="status">Desconectado</span>
  </div>

  <div class="row">
    <div>
      <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    <div id="info">
      <b>Información</b><br/>
      Estado: <span id="infoState">—</span><br/>
      FPS: <span id="infoFps">—</span><br/>
      Manos: <span id="infoHands">—</span><br/>
      Landmarks: <span id="infoLm">—</span>
    </div>
  </div>

  <video id="video" autoplay playsinline style="display:none"></video>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video');
    const btnConnect = document.getElementById('btnConnect');
    const statusEl = document.getElementById('status');

    let ws = null;
    let streaming = false;
    let frameCount = 0;
    let lastFpsTime = performance.now();

    // ── Conectar/desconectar ──────────────────────────────────────────────────
    btnConnect.addEventListener('click', () => {
      if (streaming) { stopStream(); return; }
      startStream();
    });

    async function startStream() {
      const url = document.getElementById('wsUrl').value.trim();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);

        ws = new WebSocket(url);
        ws.onopen = () => {
          streaming = true;
          statusEl.textContent = 'Conectado';
          statusEl.className = 'connected';
          btnConnect.textContent = 'Detener';
          btnConnect.className = 'stop';
          document.getElementById('infoState').textContent = 'Activo';
          requestAnimationFrame(sendFrame);
        };
        ws.onmessage = (e) => handleLandmarks(JSON.parse(e.data));
        ws.onerror = () => setError('Error de conexión');
        ws.onclose = () => { if (streaming) stopStream(); };
      } catch (err) {
        setError('Cámara no disponible: ' + err.message);
      }
    }

    function stopStream() {
      streaming = false;
      if (ws) ws.close();
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      statusEl.textContent = 'Desconectado';
      statusEl.className = '';
      btnConnect.textContent = 'Conectar';
      btnConnect.className = '';
      document.getElementById('infoState').textContent = 'Detenido';
    }

    function setError(msg) {
      statusEl.textContent = msg;
      statusEl.className = 'error';
      stopStream();
    }

    // ── Enviar frame ──────────────────────────────────────────────────────────
    let waitingResponse = false;

    function sendFrame() {
      if (!streaming) return;
      if (!waitingResponse) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          const reader = new FileReader();
          reader.onloadend = () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(reader.result);
              waitingResponse = true;
            }
          };
          reader.readAsDataURL(blob);
        }, 'image/jpeg', 0.7);
      }
      requestAnimationFrame(sendFrame);
    }

    // ── Dibujar landmarks ─────────────────────────────────────────────────────
    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],          // pulgar
      [0,5],[5,6],[6,7],[7,8],          // índice
      [0,9],[9,10],[10,11],[11,12],     // medio
      [0,13],[13,14],[14,15],[15,16],   // anular
      [0,17],[17,18],[18,19],[19,20],   // meñique
      [5,9],[9,13],[13,17],             // palma
    ];

    function handleLandmarks(data) {
      waitingResponse = false;
      // FPS
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        document.getElementById('infoFps').textContent = frameCount;
        frameCount = 0; lastFpsTime = now;
      }

      // Si hay error del servidor
      if (data.error) {
        console.warn('Server error:', data.error);
        return;
      }

      const hands = data.filter(h => h.length > 0);
      document.getElementById('infoHands').textContent = hands.length;
      document.getElementById('infoLm').textContent = hands.length ? hands[0].length : 0;

      if (!hands.length) return;

      // Re-dibujar frame actual
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      for (const lms of hands) {
        const pts = lms.map(lm => ({
          x: lm.x * canvas.width,
          y: lm.y * canvas.height,
        }));

        // Huesos
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        for (const [a, b] of CONNECTIONS) {
          ctx.beginPath();
          ctx.moveTo(pts[a].x, pts[a].y);
          ctx.lineTo(pts[b].x, pts[b].y);
          ctx.stroke();
        }

        // Puntos
        for (const p of pts) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ff4444';
          ctx.fill();
        }
      }
    }
  </script>
</body>
</html>
